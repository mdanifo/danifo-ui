name: CI
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, build, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # --ignore-scripts skips `prepare` (a vite build); the build step below does it once.
      - run: npm ci --ignore-scripts
      - name: Unit tests with coverage
        run: npm run test:coverage
      - run: npm run build
      - name: SCSS base compiles
        run: npm run check:scss
      - name: Package contents
        run: npm run check:pack
      - name: Consumer install from the tarball
        run: npm run check:consumer

  e2e:
    name: Playwright
    uses: ./.github/workflows/browser-tests.yml
    with:
      setup: npm ci --ignore-scripts
      test: npm run test:e2e
