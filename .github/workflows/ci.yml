name: CI
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, build, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # --ignore-scripts: `prepare` would build the library during the install
      # and the build step would build it again. One build, in the open, below.
      - run: npm ci --ignore-scripts
      - name: Unit and component tests, with the coverage threshold
        run: npm run test:coverage
      - run: npm run build
      - name: The SCSS base compiles against Bootstrap, the way an app imports it
        run: npm run check:scss
      - name: The package ships dist/ and scss/, and nothing else
        run: npm run check:pack
      - name: An app can import the packed tarball and compile its theme through it
        run: npm run check:consumer

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # The browser download is the slow part; keep it per Playwright version.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: End-to-end tests against the demo, in Chromium at 390px and 1280px
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
